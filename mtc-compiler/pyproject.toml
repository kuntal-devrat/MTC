[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtc-compiler"
version = "0.1.0"
description = "Compile neural network definitions for on-device training on microcontrollers"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mtc = "mtc_compiler.cli:main"

[tool.setuptools.packages.find]
where = ["."]
